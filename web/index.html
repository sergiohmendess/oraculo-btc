<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Oráculo BTC</title>
    <link rel="stylesheet" href="style.css">

    <!-- TradingView Widget Script -->
    <script src="https://s3.tradingview.com/tv.js"></script>
</head>

<body>

    <div class="container">

        <h1>🔮 ORÁCULO BTC</h1>

        <!-- MINI DASHBOARD -->
        <div class="card">

            <div class="row">
                <span>Preço atual:</span>
                <span id="price">...</span>
            </div>

            <div class="row">
                <span>Probabilidade de subir:</span>
                <span id="probUp" class="green">...</span>
            </div>

            <div class="row">
                <span>Probabilidade de cair:</span>
                <span id="probDown" class="red">...</span>
            </div>

            <div class="row">
                <span>Tendência sugerida:</span>
                <span id="trend" class="trend">...</span>
            </div>

        </div>

        <!-- GRÁFICO AO VIVO -->
        <div class="chart-container">
            <div id="tradingview_chart"></div>
        </div>

        <footer>
            Desenvolvido por: <strong>Sérgio Mendes</strong>
        </footer>

    </div>

<script>
    // TradingView gráfico BTCUSD
    new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "15",
        "timezone": "America/Sao_Paulo",
        "theme": "dark",
        "style": "1",
        "locale": "br",
        "toolbar_bg": "#1e1e2f",
        "enable_publishing": false,
        "hide_top_toolbar": false,
        "save_image": false,
        "container_id": "tradingview_chart"
    });
</script>

<script src="script.js"></script>

</body>
</html>
